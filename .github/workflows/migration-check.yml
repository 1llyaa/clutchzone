name: Migration check

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"

permissions:
  contents: read

jobs:
  apply-migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # The migrations are written for Supabase, which provides three things
      # plain postgres:16 does not: the `auth` schema, `storage.objects`, and
      # the `supabase_realtime` publication. 004 hit the first of them and the
      # run died there, so this job could never reach the migrations a pull
      # request actually changed — it failed the first time it ever ran.
      #
      # Stubs, not a Supabase emulation: enough for the DDL to resolve. This
      # check asserts that migrations apply in order on a clean database, not
      # how they behave at runtime, so constant-returning auth functions and an
      # empty storage.objects are sufficient — RLS policies need only to parse.
      - name: Stub the Supabase-provided schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
            id    uuid PRIMARY KEY,
            email text
          );
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;
          CREATE OR REPLACE FUNCTION auth.role() RETURNS text
            LANGUAGE sql STABLE AS $$ SELECT 'anon'::text $$;

          -- Storage bucket policies (005, 006, 013, 014) attach to this table,
          -- which only exists because Supabase Storage creates it. RLS has to
          -- be on or CREATE POLICY has nothing to attach to.
          CREATE SCHEMA IF NOT EXISTS storage;
          CREATE TABLE IF NOT EXISTS storage.objects (
            id        uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            bucket_id text,
            name      text
          );
          ALTER TABLE storage.objects ENABLE ROW LEVEL SECURITY;

          -- 009 and 011 add tables to Supabase's realtime publication.
          CREATE PUBLICATION supabase_realtime;

          -- 025 schedules the payment nudge with pg_cron and calls it through
          -- pg_net. Neither extension exists on plain postgres:16, and unlike
          -- the stubs above they cannot be faked by CREATE EXTENSION at all --
          -- there is no control file to load. The apply step below comments
          -- those two lines out; these stubs stand in for what they would have
          -- provided, so the statements that use them still have to parse.
          CREATE SCHEMA IF NOT EXISTS cron;
          CREATE TABLE IF NOT EXISTS cron.job (
            jobid    bigserial PRIMARY KEY,
            jobname  text,
            schedule text,
            command  text
          );
          CREATE OR REPLACE FUNCTION cron.schedule(job_name text, schedule text, command text)
            RETURNS bigint LANGUAGE sql AS $$
              INSERT INTO cron.job (jobname, schedule, command)
              VALUES (job_name, schedule, command)
              RETURNING jobid
            $$;
          CREATE OR REPLACE FUNCTION cron.unschedule(job_name text)
            RETURNS boolean LANGUAGE sql AS $$
              DELETE FROM cron.job WHERE jobname = job_name;
              SELECT true;
            $$;
          CREATE SCHEMA IF NOT EXISTS net;
          SQL

      - name: Apply migrations in order
        env:
          PGPASSWORD: postgres
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            # pg_cron and pg_net are Supabase-provided and have no control file
            # here, so CREATE EXTENSION aborts the run before it reaches the
            # migrations a pull request actually changed. Comment those two
            # lines out and let the stubbed cron API above carry the rest; what
            # this job asserts is that the DDL applies in order, not that the
            # scheduler runs.
            sed -E 's/^CREATE EXTENSION IF NOT EXISTS (pg_cron|pg_net);/-- CI stub: &/' "$f" \
              | psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          done
