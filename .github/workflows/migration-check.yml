name: Migration check

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "supabase/migrations/**"

jobs:
  apply-migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # The migrations are written for Supabase, which ships an `auth` schema
      # that plain postgres:16 does not have — 004 referenced it and the whole
      # run died there, so this job could never get as far as the migrations a
      # pull request actually changed. Stubs, not a Supabase emulation: just
      # enough for the DDL to resolve. Nothing here asserts runtime behaviour,
      # so auth.uid()/auth.role() returning constants is fine — RLS policies
      # only need to parse and plan.
      - name: Stub the Supabase auth schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE TABLE IF NOT EXISTS auth.users (
            id    uuid PRIMARY KEY,
            email text
          );
          CREATE OR REPLACE FUNCTION auth.uid() RETURNS uuid
            LANGUAGE sql STABLE AS $$ SELECT NULL::uuid $$;
          CREATE OR REPLACE FUNCTION auth.role() RETURNS text
            LANGUAGE sql STABLE AS $$ SELECT 'anon'::text $$;
          SQL

      - name: Apply migrations in order
        env:
          PGPASSWORD: postgres
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
          done
